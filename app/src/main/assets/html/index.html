<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>视频播放器</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>

<body>

    <video
        id="video"
        controls
        autoplay
        playsinline
        preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("video");

        video.addEventListener("ended", function () {
            video.currentTime = 0;
            video.play();
        });

        video.play().catch(function () {
            // 如果系统禁止自动播放，显示播放按钮
        });
    </script>

</body>
</html>
